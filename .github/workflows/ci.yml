name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneylens
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: moneylens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U moneylens -d moneylens_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://moneylens:synthetic-ci-password@localhost:5432/moneylens_test
      TEST_DATABASE_URL: postgresql://moneylens:synthetic-ci-password@localhost:5432/moneylens_test
      JWT_SECRET: synthetic-ci-only-jwt-secret-at-least-32-characters
      IDENTIFIER_HASH_KEY: synthetic-ci-only-distinct-hash-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run evaluate
      - run: npm audit --omit=dev
