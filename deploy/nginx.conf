# Integrate this server behind your TLS terminator; do not expose plaintext publicly.
limit_req_zone $binary_remote_addr zone=moneylens:10m rate=2r/s;
server {
  listen 8080;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 21m;
  client_body_timeout 120s;
  location /api/ {
    limit_req zone=moneylens burst=20 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    proxy_set_header Connection "";
    # Never log $request_body, request headers, query strings, or upstream bodies.
  }
}
